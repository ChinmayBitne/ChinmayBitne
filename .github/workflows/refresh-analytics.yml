name: Refresh profile analytics

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-analytics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test card generation
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Generate public repository cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/analytics.py
      - name: Commit refreshed cards
        run: |
          git add assets/analytics
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(profile): refresh public repository analytics'
          git push
