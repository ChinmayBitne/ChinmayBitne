<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Chinmay Bitne — AI systems beyond the model</title>
  <desc id="description">A dark technical blueprint banner connecting evidence, models, evaluation, and product nodes.</desc>
  <defs>
    <linearGradient id="background" x1="54" y1="24" x2="1148" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111F"/>
      <stop offset="0.55" stop-color="#10152C"/>
      <stop offset="1" stop-color="#071A1B"/>
    </linearGradient>
    <linearGradient id="accent" x1="742" y1="92" x2="1088" y2="290" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="0.52" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(964 182) rotate(90) scale(238 328)">
      <stop stop-color="#38BDF8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#94A3B8" stroke-opacity="0.08"/>
    </pattern>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="24" fill="url(#glow)"/>
  <path d="M0 318C220 263 333 356 545 308C757 260 893 252 1200 331V360H0V318Z" fill="#2DD4BF" fill-opacity="0.035"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="58" y="50" width="188" height="30" rx="15" fill="#A78BFA" fill-opacity="0.13" stroke="#A78BFA" stroke-opacity="0.5"/>
    <circle cx="77" cy="65" r="4" fill="#2DD4BF"/>
    <text x="90" y="69" fill="#C4B5FD" font-size="12" font-weight="700" letter-spacing="1.5">AVAILABLE TO BUILD</text>

    <text x="58" y="151" fill="#F8FAFC" font-size="58" font-weight="780" letter-spacing="-2.2">Chinmay Bitne</text>
    <text x="60" y="199" fill="#C7D2FE" font-size="25" font-weight="560" letter-spacing="-0.4">AI systems beyond the model.</text>
    <text x="60" y="242" fill="#94A3B8" font-size="16">Grounded retrieval · Agentic systems · Multimodal AI · Data products</text>

    <g transform="translate(60 281)">
      <text x="0" y="0" fill="#A78BFA" font-size="12" font-weight="750" letter-spacing="1.8">GROUND</text>
      <circle cx="78" cy="-4" r="2.5" fill="#475569"/>
      <text x="94" y="0" fill="#38BDF8" font-size="12" font-weight="750" letter-spacing="1.8">EVALUATE</text>
      <circle cx="187" cy="-4" r="2.5" fill="#475569"/>
      <text x="203" y="0" fill="#2DD4BF" font-size="12" font-weight="750" letter-spacing="1.8">SHIP</text>
    </g>
  </g>

  <g transform="translate(720 45)">
    <circle cx="236" cy="135" r="104" stroke="url(#accent)" stroke-width="1.2" stroke-opacity="0.34" stroke-dasharray="5 8"/>
    <circle cx="236" cy="135" r="72" stroke="#38BDF8" stroke-opacity="0.2"/>
    <circle cx="236" cy="135" r="42" fill="#0F172A" stroke="url(#accent)" stroke-width="2"/>
    <circle cx="236" cy="135" r="28" fill="url(#accent)" fill-opacity="0.12"/>
    <path d="M223 132L233 142L251 122" stroke="#E0F2FE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M81 76C142 52 169 69 209 104" stroke="#A78BFA" stroke-opacity="0.62"/>
    <path d="M265 105C303 73 335 63 390 80" stroke="#38BDF8" stroke-opacity="0.62"/>
