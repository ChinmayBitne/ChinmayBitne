      <g transform="translate(18 49)">
        <rect width="102" height="54" rx="12" fill="#111827" stroke="#A78BFA" stroke-opacity="0.7"/>
        <circle cx="19" cy="20" r="5" fill="#A78BFA"/>
        <text x="32" y="24" fill="#DDD6FE">EVIDENCE</text>
        <text x="16" y="42" fill="#64748B" font-size="9" letter-spacing="0.8">DATA · CONTEXT</text>
      </g>
      <g transform="translate(360 54)">
        <rect width="104" height="54" rx="12" fill="#111827" stroke="#38BDF8" stroke-opacity="0.7"/>
        <circle cx="19" cy="20" r="5" fill="#38BDF8"/>
        <text x="32" y="24" fill="#BAE6FD">MODELS</text>
        <text x="16" y="42" fill="#64748B" font-size="9" letter-spacing="0.8">RAG · AGENTS</text>
      </g>
      <g transform="translate(360 171)">
        <rect width="104" height="54" rx="12" fill="#111827" stroke="#2DD4BF" stroke-opacity="0.7"/>
        <circle cx="19" cy="20" r="5" fill="#2DD4BF"/>
        <text x="32" y="24" fill="#99F6E4">PRODUCT</text>
        <text x="16" y="42" fill="#64748B" font-size="9" letter-spacing="0.8">API · UX · OPS</text>
      </g>
      <g transform="translate(10 171)">
        <rect width="116" height="54" rx="12" fill="#111827" stroke="#A78BFA" stroke-opacity="0.55"/>
        <circle cx="19" cy="20" r="5" fill="#C4B5FD"/>
        <text x="32" y="24" fill="#DDD6FE">EVALUATION</text>
        <text x="16" y="42" fill="#64748B" font-size="9" letter-spacing="0.8">QUALITY · SAFETY</text>
      </g>
